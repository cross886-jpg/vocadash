<!DOCTYPE html>
<html lang="ko">

<head>

  <!-- Google Fonts & Material Symbols -->

  <!-- Tailwind CSS CDN & Design System Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#006e2f",
            "primary-container": "#22c55e",
            "on-primary": "#ffffff",
            "surface": "#faf8ff",
            "on-surface": "#131b2e"

<body class="bg-slate-100 font-body-md text-slate-800 flex items-center justify-center min-h-screen p-4 select-none antialiased">

  <!-- 404 Central Card Container -->

    <!-- Top Decorative Blur -->
    <div class="absolute -top-10 -right-10 w-28 h-28 bg-emerald-100/60 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute -bottom-10 -left-10 w-28 h-28 bg-sky-100/60 rounded-full blur-2xl pointer-events-none"></div>

    <!-- Cat Mascot Avatar with Compass Badge -->
    <div class="relative w-28 h-28 mb-4 flex items-center justify-center">
      <div class="absolute inset-0 bg-emerald-50 rounded-full blur-md transform scale-95"></div>
      <img src="assets/characters/es-sad.webp?v=48" alt="길을 잃은 고양이 마스코트" class="relative z-10 w-24 h-24 object-contain drop-shadow-md transform hover:scale-105 transition-transform duration-300" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'text-6xl\'>🧭</span>';">
      <span class="absolute -bottom-1 -right-1 z-20 w-9 h-9 rounded-full bg-white shadow-md border border-slate-100 flex items-center justify-center text-xl" title="나침반">🧭</span>
    </div>

    <!-- 404 Badge -->
    <span class="inline-flex items-center gap-1 px-3 py-1 mb-2.5 rounded-full bg-slate-100 text-slate-500 text-[11px] font-bold tracking-wider uppercase">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
      404 Page Not Found
    </span>

    <!-- Title & Description -->
    <h1 class="text-2xl font-black text-slate-800 tracking-tight mb-2">길을 잃으셨나요?</h1>
    <p class="text-xs sm:text-sm text-slate-600 leading-relaxed font-medium mb-6">
      요청하신 페이지를 찾을 수 없습니다.<br>
      메인 러닝 로드맵으로 안내해 드릴게요.
    </p>

    <!-- Return to Main Button -->
    <a href="./" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 active:scale-95 text-white font-bold text-sm shadow-md transition-all flex items-center justify-center gap-2 group cursor-pointer">
      <span class="material-symbols-outlined text-[20px] transition-transform group-hover:-translate-x-1">home</span>
      <span>메인으로 돌아가기</span>
    </a>

    <!-- Footer Branding -->
    <div class="mt-6 pt-4 border-t border-slate-100 w-full flex items-center justify-center gap-1.5 text-[11px] text-slate-400 font-medium">
      <span>⚡️ VocaDash</span>
      <span>·</span>
      <span>단어로 질주하는 보카 대시</span>
    </div>

</html>
