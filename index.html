  <style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        min-height: max(884px, 100dvh);
        background-color: #f1f5f9;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 12px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }
    
    ::-webkit-scrollbar {
      display: none;
    }

    /* Springy tactile bounce effect when clicking nodes */
    @keyframes node-bounce {
      0% { transform: scale(1); }
      30% { transform: scale(0.88) translateY(6px); }
      55% { transform: scale(1.15) translateY(-8px); }
      75% { transform: scale(0.96) translateY(2px); }
      100% { transform: scale(1) translateY(0); }
    }
    .animate-node-bounce {
      animation: node-bounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Small badge tap bounce */
    .active-pop:active {
      transform: scale(0.92);
    }
  </style>
</head>

  <!-- LIGHTWEIGHT INTERACTION JAVASCRIPT                 -->
  <!-- ================================================= -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Springy bounce effect on node click
      const nodeTargets = document.querySelectorAll('.node-target');
      nodeTargets.forEach((target) => {
        target.addEventListener('click', (e) => {
          const btn = target.querySelector('.node-btn');
          if (btn) {
            btn.classList.remove('animate-node-bounce');
            // Force browser reflow to restart animation reliably
            void btn.offsetWidth;
            btn.classList.add('animate-node-bounce');

            btn.addEventListener('animationend', () => {
              btn.classList.remove('animate-node-bounce');
            }, { once: true });
          }
        });
      });

      // 2. Category Filter Pills Toggle
      const pills = document.querySelectorAll('.category-pill');
      pills.forEach((pill) => {
        pill.addEventListener('click', () => {
          pills.forEach((p) => {
            p.className = 'category-pill flex-shrink-0 py-1 px-3 rounded-full font-label-sm text-xs bg-surface-container-low text-on-surface-variant font-medium hover:bg-surface-container transition-colors cursor-pointer';
          });
          pill.className = 'category-pill flex-shrink-0 py-1 px-3 rounded-full font-label-sm text-xs bg-primary text-on-primary font-bold shadow-sm cursor-pointer';
        });
      });

      // 3. Bottom Nav Items Toggle
      const navItems = document.querySelectorAll('.nav-item');
      navItems.forEach((item) => {
        item.addEventListener('click', (e) => {
          e.preventDefault();
          navItems.forEach((n) => {
            n.classList.remove('text-primary', 'font-bold');
            n.classList.add('text-on-surface-variant');
          });
          item.classList.add('text-primary', 'font-bold');
          item.classList.remove('text-on-surface-variant');
        });
      });
    });
  </script>

</body>
</html>
